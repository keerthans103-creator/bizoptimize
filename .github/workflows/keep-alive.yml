name: Keep Render services warm

# Render's free tier spins the ml-service/backend/gateway down after ~15min
# idle, and a cold start can take 30s-2min (measured up to ~113s for the
# Spring Boot backend). Pinging every 10 minutes -- comfortably under that
# idle threshold -- keeps them warm so a real visitor never eats a cold
# start.
#
# IMPORTANT: ping each service directly with a generous timeout. Routing
# this through the gateway's /health (which internally pings ml-service and
# backend with only a 3s timeout, then swallows failures) looked like it
# worked -- every run showed green -- but 3s can't complete a real 48-113s
# cold boot, so the services kept going to sleep anyway despite "successful"
# runs. Pinging directly here means the job actually waits out a cold start
# when one happens, instead of firing a doomed short-timeout ping and
# reporting success regardless.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping ml-service directly (worst-case cold start ~60s)
        run: curl -sS -m 150 -f https://bizoptimize-ml-service.onrender.com/health
      - name: Ping backend directly (worst-case cold start ~113s)
        run: curl -sS -m 150 -f https://bizoptimize-backend.onrender.com/api/health
      - name: Ping gateway
        run: curl -sS -m 150 -f https://bizoptimize-gateway.onrender.com/health
      - name: Ping frontend
        run: curl -sS -m 30 -f -o /dev/null https://bizoptimize-frontend.onrender.com/
